<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        a {
            color: black;
            text-decoration: none;
        }
        li{
            list-style: upper-alpha;
        }
        li:nth-child(2) > a, li:nth-child(3) > a{
            color: red;
        }
    </style>
</head>
<body>
<ul>
    <li><a href="#">home</a></li>
    <li><a href="#">product</a></li>
    <li><a href="#">About us</a></li>
    <li><a href="#">Jobs</a></li>
</ul>
</body>
</html>
