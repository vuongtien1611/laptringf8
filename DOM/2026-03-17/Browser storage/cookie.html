    document.cookie = 'token=abc123; max-age=3600'; // het han sau 3600s
    document.cookie = 'token=abcxyz; secure; path=/;'; //Cookie chỉ được gửi khi dùng HTTPS
    // path=/
        //  Cookie có hiệu lực trên toàn bộ website
        // / → dùng ở mọi route
        // /admin → chỉ dùng trong /admin
//--------------------------

    const cookiesString = document.cookie

    // console.log(cookiesString.split(';'));

    cookiesString.split(';').reduce((acc, cookie) => {
        const [key, value] = cookie.split('=');
        acc[key] = value;
        return acc;
    }, {})







</script>
