<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Demo</title>
</head>
<body>
<form action="https://api-gateway.fullstack.edu.vn/action_page.php" method="post">

    <label for="pa">Password</label>
    <input id="pa" type="password" name="password" placeholder="password"><br><br>

    <label for="xanh">Text</label>
    <input id="xanh" type="text" placeholder="text" name="text"><br><br>

    <label for="email">Email</label>
    <input id="email" type="email" name="email" placeholder="email"><br><br>

    <label>Checkbox</label><br>
    <input id="do" type="checkbox" name="checkbox[]" value="checkbox1">
    <label for="do">checkbox1</label>
    <input id="do2" type="checkbox" name="checkbox[]" value="checkbox2">
    <label for="do2">checkbox2</label>
    <br><br>

    <label>Radio</label><br>
    <input id="tick1" type="radio" name="tick" value="tick1">
    <label for="tick1">tick1</label>

    <input id="tick2" type="radio" name="tick" value="tick2">
    <label for="tick2">tick2</label>
    <br><br>

    <label for="device">Select</label>
    <select id="device" name="device">
        <option value="mtc">máy thông công</option>
        <option value="mt">máy tính</option>
        <option value="mtb">máy tính bàn</option>
    </select>
    <br><br>

    <input type="submit">

</form>
</body>
</html>
