    <style>
        body{
            font-family: Arial;
            max-width: 800px;
            margin: auto;
            background: #f5f5f5;
        }

        /* tiêu đề */
        h1{
            text-align: center;
            transition: 0.3s;
        }

        /* hover tiêu đề */
        h1:hover {
            color: green;
            transform: scale(1.1);
        }

        /* h1 và p */
        h1, p {
            color: red;
        }

        /* p sau h1 */
        h1 + p {
            color: blue;
            text-align: center;
        }

        /* p sau h1 */
        h1 ~ p {
            background-color: #fff3cd;
            padding: 5px;
            border-radius: 5px;
        }

        /* danh sách bài viết */
        ul{
            list-style: none;
            padding: 0;
        }

        /* từng bài viết */
        li{
            background: white;
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            transition: 0.3s;
        }

        /* hover bài viết */
        li:hover{
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* màu theo vị trí */
        li:first-child {
            border-left: 5px solid red;
        }

        li:nth-child(2) {
            border-left: 5px solid blue;
        }

        li:last-child {
            border-left: 5px solid green;
        }

        /* hover tiêu đề bài viết */
        li h3:hover{
            color: orange;
            cursor: pointer;
        }

        /* hover nội dung */
        li p:hover{
            color: purple;
        }

        /* form */
        form{
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        /* checkbox radio */
        input[type="checkbox"],
        input[type="radio"] {
            accent-color: red;
            transform: scale(1.2);
            margin-right: 5px;
        }

        /* hover input */
        input:hover{
            cursor: pointer;
        }

        /* p theo type */
        p:nth-of-type(2) {
            border: 2px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>

<h1>Danh sách bài viết</h1>
<p>Chào mừng bạn đến với website</p>

<ul>
    <li>
        <h3>Bài viết 1</h3>
        <p>Nội dung bài viết 1</p>
    </li>
    <li>
        <h3>Bài viết 2</h3>
        <p>Nội dung bài viết 2</p>
    </li>
    <li>
        <h3>Bài viết 3</h3>
        <p>Nội dung bài viết 3</p>
    </li>
    <li>
        <h3>Bài viết 4</h3>
        <p>Nội dung bài viết 4</p>
    </li>
</ul>

<h2>Đăng ký</h2>

<form>
    <p>Chọn sở thích:</p>
    <input type="checkbox"> Đá bóng <br>
    <input type="checkbox"> Code <br>

    <p>Giới tính:</p>
    <input type="radio" name="gt"> Nam
    <input type="radio" name="gt"> Nữ
</form>

</body>
